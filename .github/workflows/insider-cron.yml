name: Insider cron

on:
  schedule:
    # Twice daily — usage sync + customer reminders sooner, still 1 email/order/day.
    # 06:00 UTC and 18:00 UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Run NoorLink cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi
          curl -fsS -X POST "https://api.noorlink.co/api/cron/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
