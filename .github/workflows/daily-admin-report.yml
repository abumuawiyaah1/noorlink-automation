name: Daily admin report

on:
  schedule:
    # 10:00/11:00 UTC = 6:00 New York (EDT/EST). 14:00/15:00 catch GitHub delay.
    - cron: "0 10,11,14,15 * * *"
  workflow_dispatch:

jobs:
  send-admin-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Send NoorLink admin reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipping"
            exit 0
          fi
          curl -fsS -X POST "https://api.noorlink.co/api/cron/admin-reports" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
