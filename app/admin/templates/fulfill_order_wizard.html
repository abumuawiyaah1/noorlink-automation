{% extends "sqladmin/layout.html" %}
{% block content %}
{% include "includes/admin_panel_styles.html" %}
<div class="container-fluid" style="max-width:720px;">
  {% include "includes/wizard_chrome.html" %}
  <h1 class="h3 mb-2">Fulfill a stuck order</h1>
  <p class="text-muted mb-4">Use when Stripe charged the customer but the eSIM never provisioned (webhook missed).</p>
  <form method="post" class="nl-wizard-panel">
    <div class="mb-3">
      <label class="form-label" for="order_number">Order number *</label>
      <input class="form-control text-uppercase" id="order_number" name="order_number" required
        value="{{ form_values.get('order_number', '') }}" placeholder="NL-ABC12345" />
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="paid_only" id="paid_only" value="1"
        {% if form_values.get('paid_only') %}checked{% endif %} />
      <label class="form-check-label" for="paid_only">Order is already marked paid — only run fulfillment</label>
    </div>
    <button type="submit" class="btn btn-primary">Fulfill order</button>
  </form>
</div>
{% endblock %}
